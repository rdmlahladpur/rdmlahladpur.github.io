<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Not Found</title>
<meta name="robots" content="noindex">
<style>
  html,body{height:100%}
  body{margin:0;background:#fff;color:#222;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{max-width:460px}
  h1{font-size:70px;margin:0;font-weight:700;letter-spacing:-2px;color:#111}
  h2{font-size:1.35rem;margin:6px 0 16px;font-weight:600}
  p{margin:0 0 8px;line-height:1.6;color:#555;font-size:.98rem}
  code{background:#f4f4f4;padding:2px 6px;border-radius:4px;font-size:.9rem}
  .hr{height:1px;background:#e5e5e5;margin:22px 0}
  small{color:#999;font-size:.82rem}
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>This page isn&rsquo;t working</h2>
    <p>The requested file was not found on this server.</p>
    <p>If you are the site owner, check your deployment or try again later.</p>
    <div class="hr"></div>
    <small>HTTP ERROR 404</small>
  </div>
</body>
</html>
